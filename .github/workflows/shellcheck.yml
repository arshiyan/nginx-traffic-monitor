name: ShellCheck

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          set -e
          shellcheck -x install.sh traffic-monitor.sh || true
          # Libraries are sourced; check with external sources follow
          shellcheck -x lib/*.sh || true
          find plugins -name 'plugin.sh' -print0 | xargs -0 -r shellcheck -x || true
