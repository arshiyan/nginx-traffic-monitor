# Nginx Traffic Monitor — default configuration
# Override by exporting variables before launch or editing this file.

NTM_APP_NAME="Nginx Traffic Monitor"
NTM_APP_VERSION="1.0.0"

# Log produced by nginx log_format "traffic"
NTM_TRAFFIC_LOG="/var/log/nginx/traffic.log"

# nginx configuration discovery
NTM_NGINX_CONF=""
NTM_NGINX_BIN=""

# Backup directory for nginx.conf snapshots
NTM_BACKUP_DIR="/var/backups/nginx-traffic-monitor"

# log_format name and access_log directive
NTM_LOG_FORMAT_NAME="traffic"
NTM_LOG_FORMAT_BODY='$time_iso8601 $remote_addr $host $status $request_method "$request_uri" $body_bytes_sent'

# Report defaults
NTM_TOP_N=20
NTM_EXPORT_DIR="/tmp/nginx-traffic-monitor"

# Ownership for traffic.log (auto-detected when empty)
NTM_LOG_OWNER=""
NTM_LOG_GROUP=""

# Sample log for offline demo (relative to project root when absolute path missing)
NTM_SAMPLE_LOG="samples/traffic.log.sample"
